[preset.0]

name="Android"
platform="Android"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.xml, mods/*.xml, mods/*.json"
exclude_filter="tests/*"
export_path="../build/ftl-proto.apk"

[preset.0.options]

gradle_build/use_gradle_build=false
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
package/unique_name="org.ftlproto.game"
package/name="FTL Proto"
package/signed=true
screen/immersive_mode=true
screen/edge_to_edge=true

[preset.1]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.xml, mods/*.xml, mods/*.json"
exclude_filter="tests/*"
export_path="../build/windows/FTL Proto.exe"

[preset.1.options]

binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"

[preset.2]

name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features="wallpaper"
export_filter="all_resources"
include_filter="data/*.xml, mods/*.xml, mods/*.json"
exclude_filter="tests/*, web/*"
export_path="../build/wallpaper/Vortex Autobattle Web/index.html"

[preset.2.options]

variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell="res://web/wallpaper_shell.html"
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=false
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
